version: '3.8'

services: 
  db: 
    image: postgres:16
    container_name: todo-postgres-innowise
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: tododb
    ports: 
      - "5432:5432"
    volumes: 
      - pgdata:/var/lib/postgresql/data

  redis: 
    image: redis:7-alpine
    container_name: todo-redis-innowise
    restart: unless-stopped
    ports: 
      - "6379:6379"
    volumes:
      - redisdata:/data
    
volumes: 
  pgdata:
  redisdata:
